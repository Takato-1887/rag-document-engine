[project]
name = "private-document-intelligence-engine"
version = "0.1.0"
description = "Production-grade local RAG system for private document intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "P Bhattacharya", email = "brihadratha184@zohomail.com" }
]
keywords =  ["rag", "llm", "nlp", "document-intelligence", "local-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# =============================================================================
# Runtime Dependencies
# Added incrementally as each phase requires them.
# Current: Phase 0 baseline only.
# =============================================================================

dependencies = [
    # Configuration & validation
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    # Structured logging
    "loguru>=0.7.2,<1.0.0",
    # Environment variable loading
    "python-dotenv>=1.0.1,<2.0.0",
    # HTTP client (used by multiple components later)
    "httpx>=0.27.0,<1.0.0",
    # Async utilities
    "anyio>=4.4.0,<5.0.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
]

# =============================================================================
# Optional Dependency Groups
# Install with: uv sync --group dev
# =============================================================================

[dependency-groups]
dev = [
  # Testing
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.7,<1.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "pytest-mock>=3.14.0,<4.0.0",

  # Code quality — ruff replaces flake8 + isort + pyupgrade
  "ruff>=0.4.8,<1.0.0",

  # Type checking
  "mypy>=1.10.0,<2.0.0",

  # Pre-commit hook manager
  "pre-commit>=3.7.1,<4.0.0",

  # Better test output
  "rich>=13.7.1,<14.0.0",
]

# =============================================================================
# Build System
# uv uses hatchling as the build backend.
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# =============================================================================
# uv Configuration
# =============================================================================

[tool.uv]
# PyTorch requires a special index for CUDA builds.
# cu128 = CUDA 12.8 — compatible with your driver (CUDA 13.2) via backward compat.
# This tells uv WHERE to look for torch, torchvision, torchaudio.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# These three packages must come from the PyTorch CUDA index, not PyPI.
# Without this, uv installs the CPU-only versions from PyPI.
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
# Tell pytest where tests live
testpaths = ["tests"]

# asyncio mode: auto means async test functions work without @pytest.mark.asyncio
asyncio_mode = "auto"

# Show extra test summary: (f)ailed, (e)rror, (s)kipped, (p)assed
addopts = [
  "--tb=short",
  "--strict-markers",
  "-ra",
]

# Register custom markers so pytest doesn't warn about unknown marks
markers = [
  "unit: fast, isolated unit tests",
  "integration: tests requiring real models or database",
  "slow: tests that take more than 10 seconds",
  "gpu: tests that require NVIDIA GPU",
]

# Minimum pytest version
minversion = "8.0"

# =============================================================================
# Ruff — Linter + Formatter (replaces flake8, isort, black, pyupgrade)
# =============================================================================

[tool.ruff]
# Same line length used across all tools
line-length = 88

# Minimum Python version to target for syntax rules
target-version = "py311"

# Directories ruff should never touch
exclude = [
  ".venv",
  ".git",
  "__pycache__",
  "*.egg-info",
  "build",
  "dist",
  "migrations",
]

[tool.ruff.lint]
# Rule sets to enable:
# E, W = pycodestyle (PEP 8 style)
# F = pyflakes (unused imports, undefined names)
# I = isort (import ordering)
# N = pep8-naming (naming conventions)
# UP = pyupgrade (modern Python syntax)
# B = flake8-bugbear (common bugs)
# C4 = flake8-comprehensions (list comprehension style)
# SIM = flake8-simplify (code simplification hints)
# TCH = flake8-type-checking (TYPE_CHECKING guard hints)
# RUF = ruff-specific rules
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF"]

# Rules we intentionally ignore with justification:
ignore = [
  "E501",   # Line too long — ruff formatter handles this, not the linter
  "B008",   # Do not perform function calls in default arguments
            # — FastAPI uses Depends() this way, it's intentional
  "SIM108", # Ternary operator suggestion — sometimes if/else is clearer
  "RUF012", # Mutable class variable — Pydantic models use this correctly
]

# Allow auto-fixing for safe rules only
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# Treat src as a first-party package for import ordering
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Test files: allow assert statements and unused imports (fixtures)
"tests/**/*.py" = ["S101", "F401", "F811"]
# __init__.py files: allow star imports and unused imports (re-exports)
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
# Use double quotes (consistent with most Python projects)
quote-style = "double"
# Indent with 4 spaces
indent-style = "space"
# Unix line endings
line-ending = "lf"

# =============================================================================
# Mypy — Static Type Checker
# =============================================================================

[tool.mypy]
python_version = "3.11"

# Strictness settings — we start moderately strict
# and tighten as the codebase matures
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true

# Don't require type annotations on every function yet
# — tighten this later when codebase is stable
disallow_untyped_defs = false

# Third-party libraries without stubs — ignore missing stubs
[[tool.mypy.overrides]]
module = [
  "loguru",
  "chromadb",
  "chromadb.*",
  "sentence_transformers",
  "sentence_transformers.*",
  "rank_bm25",
  "llama_cpp",
  "llama_cpp.*",
  "gradio",
  "gradio.*",
  "ragas",
  "ragas.*",
  "mlflow",
  "mlflow.*",
  "fitz",
  "docx",
  "bs4",
  "diskcache",
]
ignore_missing_imports = true


# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
  "tests/*",
  "scripts/*",
  "*/migrations/*",
]

[tool.coverage.report]
# Fail if total coverage drops below this threshold
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@abstract",
]
